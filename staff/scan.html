<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff — Check Guests In | House of Kaos</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Playfair+Display:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0a0807;
  --panel:#171412;
  --panel-raised:#1d1814;
  --line:rgba(201,169,106,.28);
  --line-soft:rgba(201,169,106,.14);
  --gold:#c9a96a;
  --gold-bright:#e0c68c;
  --cream:#ece4d4;
  --cream-dim:#b9b0a0;
  --ok:#8fae7a;
  --ok-bg:rgba(143,174,122,.15);
  --conflict:#d3796f;
  --conflict-bg:rgba(211,121,111,.14);
  --tentative:#b98f4a;
  --serif-display:'Playfair Display',Georgia,serif;
  --serif-body:'Cormorant Garamond',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--black);
  color:var(--cream);
  font-family:var(--serif-body);
  font-size:1.08rem;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-bright)}
[hidden]{display:none!important}

header.top{
  border-bottom:1px solid var(--line-soft);
  padding:1.1rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
}
.brand{font-family:var(--serif-display);font-weight:600;letter-spacing:.03em;font-size:1.15rem;color:var(--cream)}
.brand span{color:var(--gold)}
.brand-sub{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-dim);display:block;margin-top:.15rem}
.who{display:flex;align-items:center;gap:1rem;font-size:.9rem;color:var(--cream-dim);flex-wrap:wrap}
.nav-link{
  font-family:var(--mono);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);padding:.35rem .8rem;border-radius:2px;color:var(--cream);
}
.nav-link:hover{border-color:var(--gold);color:var(--gold-bright)}
.signout-btn{
  background:none;border:1px solid var(--line);color:var(--cream);
  font-family:var(--serif-body);font-size:.85rem;padding:.4rem .9rem;border-radius:2px;cursor:pointer;
}
.signout-btn:hover{border-color:var(--gold);color:var(--gold-bright)}

#loginScreen{
  min-height:calc(100vh - 70px);
  display:flex;align-items:center;justify-content:center;
  padding:2rem 1.5rem;
  background:
    radial-gradient(circle at 20% 20%, rgba(201,169,106,.05), transparent 34%),
    radial-gradient(circle at 85% 75%, rgba(201,169,106,.04), transparent 30%),
    var(--black);
}
.login-box{
  width:100%;max-width:380px;
  background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:2.2rem 2rem;
}
.login-box h1{font-family:var(--serif-display);font-weight:600;font-size:1.5rem;color:var(--cream);margin-bottom:.3rem;letter-spacing:.02em}
.login-box .sub{color:var(--cream-dim);font-style:italic;font-size:.95rem;margin-bottom:1.6rem}
.field{margin-bottom:1rem}
label{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:.35rem}
input[type=email],input[type=password],input[type=text],select{
  width:100%;background:var(--black);border:1px solid var(--line);color:var(--cream);
  font-family:var(--serif-body);font-size:1rem;padding:.6rem .7rem;border-radius:2px;
}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.btn{
  font-family:var(--serif-body);font-size:.92rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.7rem 1.3rem;border:1px solid var(--gold);color:var(--black);background:var(--gold);
  border-radius:2px;cursor:pointer;transition:background .2s,color .2s;width:100%;
}
.btn:hover{background:var(--gold-bright)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn.danger{border-color:var(--conflict);color:var(--conflict);background:none}
.btn.danger:hover{background:var(--conflict-bg)}
.login-error{color:var(--conflict);font-size:.85rem;margin-top:.9rem;min-height:1.2em}

.wrap{max-width:560px;margin:0 auto;padding:2rem 1.5rem 4rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:1.5rem}
.panel + .panel{margin-top:1.4rem}
h2.side-title{font-family:var(--serif-display);font-weight:500;font-size:1.15rem;margin:0 0 1rem;color:var(--gold-bright);letter-spacing:.02em}
.empty-note{color:var(--cream-dim);font-style:italic;font-size:.95rem}
.hint{font-size:.82rem;color:var(--cream-dim);margin-top:.6rem}
.btn-row{display:flex;gap:.6rem;margin-top:1rem}

/* guest confirmation card */
.confirm-card{text-align:center}
.ref-line{font-family:var(--mono);font-size:.75rem;color:var(--gold);letter-spacing:.05em;margin-bottom:.4rem}
.guest-name{font-family:var(--serif-display);font-weight:600;font-size:1.6rem;color:var(--cream);margin-bottom:.2rem}
.event-line{color:var(--cream-dim);font-style:italic;margin-bottom:1rem}
.table-badge{
  display:inline-block;font-family:var(--mono);font-size:1.3rem;letter-spacing:.05em;
  border:1px solid var(--gold);color:var(--gold-bright);padding:.5rem 1.2rem;border-radius:2px;margin-bottom:1rem;
}
.status-row{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .55rem;border-radius:2px;white-space:nowrap}
.badge.paid{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok)}
.badge.deposit{color:var(--tentative);background:rgba(185,143,74,.15);border:1px solid var(--tentative)}
.badge.unpaid{color:var(--conflict);background:var(--conflict-bg);border:1px solid var(--conflict)}
.badge.arrived{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok)}
.notes-block{text-align:left;font-size:.9rem;color:var(--cream-dim);border-top:1px solid var(--line-soft);padding-top:.8rem;margin-top:.8rem}
.notes-block div{margin-bottom:.3rem}
.notes-block strong{color:var(--cream)}
.arrived-flash{
  background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok);
  padding:.7rem 1rem;border-radius:2px;font-family:var(--mono);font-size:.85rem;margin-bottom:1rem;
}

.party-list{text-align:left;margin-top:1rem;border-top:1px solid var(--line-soft);padding-top:1rem}
.party-list h4{font-family:var(--serif-display);font-weight:500;font-size:.95rem;color:var(--gold-bright);margin-bottom:.6rem}
.party-item{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line-soft);gap:.6rem}
.party-item:last-child{border-bottom:none}
.party-item-name{font-size:.92rem}
.mini-btn{background:none;border:1px solid var(--line);color:var(--cream-dim);font-family:var(--mono);font-size:.65rem;padding:.2rem .5rem;border-radius:2px;cursor:pointer;white-space:nowrap}
.mini-btn:hover{border-color:var(--gold);color:var(--gold-bright)}
.mini-btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>

<header class="top">
  <div class="brand">HOUSE OF KAOS<span>.</span><span class="brand-sub">Staff — Check Guests In</span></div>
  <div class="who" id="whoBar" hidden>
    <a href="index.html" class="nav-link">Prop Bookings</a>
    <a href="guests.html" class="nav-link">Guest Tickets</a>
    <span id="whoEmail"></span>
    <button class="signout-btn" id="signOutBtn">Sign Out</button>
  </div>
</header>

<div id="loginScreen">
  <div class="login-box">
    <h1>Staff Sign In</h1>
    <div class="sub">Enter the details Sarah set up for you.</div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<div class="wrap" id="appWrap" hidden>

  <div class="panel" id="resultPanel" hidden>
    <div class="confirm-card" id="confirmCard"></div>
  </div>

  <div class="panel" id="searchPanel">
    <h2 class="side-title">Find a Guest</h2>
    <div class="field">
      <label for="searchEvent">Event</label>
      <select id="searchEvent"><option value="">Select an event…</option></select>
    </div>
    <div class="field">
      <label for="searchName">Guest Name</label>
      <input type="text" id="searchName" list="searchNameList" placeholder="Start typing a name…" autocomplete="off">
      <datalist id="searchNameList"></datalist>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="searchBtn">Find Guest</button>
    </div>
    <div class="hint">Or scan a ticket's QR code with your phone's camera — it opens straight to that guest's confirmation.</div>
  </div>

</div>

<!-- Firebase (compat SDK — plain script tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyB7hELLbDYjVHO-5xxBfW5cXZUfXRnMiLc",
    authDomain: "house-of-kaos-bookings.firebaseapp.com",
    projectId: "house-of-kaos-bookings",
    storageBucket: "house-of-kaos-bookings.firebasestorage.app",
    messagingSenderId: "967474223133",
    appId: "1:967474223133:web:9e322eb02381ecc823cef4"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var events=[];

  function escapeHtml(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function money(n){return '£'+(Number(n)||0).toFixed(2);}
  function statusClass(status){return status==='Paid in Full'?'paid':status==='Deposit Paid'?'deposit':'unpaid';}
  function fmtTime(ts){
    if(!ts) return '';
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  }

  function getParam(name){
    var m=new RegExp('[?&]'+name+'=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
  }

  function loadEvents(){
    return db.collection('events').orderBy('date','asc').limit(300).get().then(function(snap){
      events=snap.docs.map(function(doc){ var d=doc.data(); return {id:doc.id,name:d.name||'',ticketPrice:d.ticketPrice||0}; });
      var sel=document.getElementById('searchEvent');
      sel.innerHTML='<option value="">Select an event…</option>'+events.map(function(e){return '<option value="'+e.id+'">'+escapeHtml(e.name)+'</option>';}).join('');
    });
  }

  function eventById(id){ return events.filter(function(e){return e.id===id;})[0]; }

  document.getElementById('searchEvent').addEventListener('change',function(){
    var eventId=this.value;
    var list=document.getElementById('searchNameList');
    list.innerHTML='';
    if(!eventId) return;
    db.collection('guests').where('eventId','==',eventId).limit(500).get().then(function(snap){
      list.innerHTML = snap.docs.map(function(doc){ return '<option value="'+escapeHtml(doc.data().name||'')+'">'; }).join('');
    });
  });

  document.getElementById('searchBtn').addEventListener('click',function(){
    var eventId=document.getElementById('searchEvent').value;
    var name=document.getElementById('searchName').value.trim();
    if(!eventId||!name){ return; }
    db.collection('guests').where('eventId','==',eventId).get().then(function(snap){
      var match=snap.docs.filter(function(doc){ return (doc.data().name||'').toLowerCase()===name.toLowerCase(); })[0]
             || snap.docs.filter(function(doc){ return (doc.data().name||'').toLowerCase().indexOf(name.toLowerCase())!==-1; })[0];
      if(match){ showGuest(match.id); }
      else{ alert('No guest found with that name for this event.'); }
    });
  });

  function showGuest(guestId){
    document.getElementById('searchPanel').hidden=true;
    var panel=document.getElementById('resultPanel');
    var card=document.getElementById('confirmCard');
    card.innerHTML='<p class="empty-note">Loading guest…</p>';
    panel.hidden=false;

    db.collection('guests').doc(guestId).get().then(function(doc){
      if(!doc.exists){
        card.innerHTML='<p class="empty-note">No guest found for this ticket. It may have been removed — check with Sarah.</p>'+backButtonHtml();
        wireBack();
        return;
      }
      var g=Object.assign({id:doc.id},doc.data());
      var e=eventById(g.eventId);
      var partyPromise = g.partyGroup
        ? db.collection('guests').where('eventId','==',g.eventId).where('partyGroup','==',g.partyGroup).get()
        : Promise.resolve(null);

      (e ? Promise.resolve(e) : db.collection('events').doc(g.eventId).get().then(function(ed){
        return ed.exists ? Object.assign({id:ed.id},ed.data()) : null;
      })).then(function(ev){
        return partyPromise.then(function(partySnap){
          renderGuestCard(g, ev, partySnap);
        });
      });
    });
  }

  function backButtonHtml(){
    return '<div class="btn-row"><button type="button" class="btn ghost" id="backBtn">Find Another Guest</button></div>';
  }
  function wireBack(){
    var b=document.getElementById('backBtn');
    if(b) b.addEventListener('click',function(){
      document.getElementById('resultPanel').hidden=true;
      document.getElementById('searchPanel').hidden=false;
      document.getElementById('searchName').value='';
      history.replaceState(null,'',window.location.pathname);
    });
  }

  function renderGuestCard(g, ev, partySnap){
    var card=document.getElementById('confirmCard');
    var partyMembers = partySnap ? partySnap.docs.map(function(doc){ return Object.assign({id:doc.id},doc.data()); }) : [g];
    var others = partyMembers.filter(function(m){ return m.id!==g.id; });

    var html='';
    if(g.arrived){ html += '<div class="arrived-flash">✓ Already checked in'+(g.arrivedAt?(' — '+fmtTime(g.arrivedAt)):'')+'</div>'; }
    html += '<div class="ref-line">'+escapeHtml(g.guestRef||'')+'</div>';
    html += '<div class="guest-name">'+escapeHtml(g.name)+'</div>';
    html += '<div class="event-line">'+(ev?escapeHtml(ev.name):'Event not found')+'</div>';
    html += '<div class="table-badge">'+(g.tableNo?('Table '+escapeHtml(g.tableNo)):'Table not yet assigned')+'</div>';
    html += '<div class="status-row"><span class="badge '+statusClass(g.paymentStatus)+'">'+escapeHtml(g.paymentStatus||'Not Paid')+'</span>'+
            (g.arrived?'<span class="badge arrived">Arrived</span>':'')+'</div>';

    var notesBits=[];
    if(g.menuChoice) notesBits.push('<div><strong>Menu:</strong> '+escapeHtml(g.menuChoice)+'</div>');
    if(g.allergies) notesBits.push('<div><strong>Allergies:</strong> '+escapeHtml(g.allergies)+'</div>');
    if(g.specialRequests) notesBits.push('<div><strong>Requests:</strong> '+escapeHtml(g.specialRequests)+'</div>');
    if(notesBits.length){ html += '<div class="notes-block">'+notesBits.join('')+'</div>'; }

    if(others.length){
      html += '<div class="party-list"><h4>With '+others.length+' more in "'+escapeHtml(g.partyGroup)+'"</h4>';
      others.forEach(function(m){
        html += '<div class="party-item"><span class="party-item-name">'+escapeHtml(m.name)+
          (m.arrived?' <span class="badge arrived">Arrived</span>':'')+'</span>'+
          '<button type="button" class="mini-btn" data-mid="'+m.id+'" '+(m.arrived?'disabled':'')+'>'+(m.arrived?'Checked in':'Check in')+'</button></div>';
      });
      html += '</div>';
    }

    html += '<div class="btn-row">';
    if(g.arrived){
      html += '<button type="button" class="btn ghost" id="undoBtn">Undo Check-In</button>';
    }else{
      html += '<button type="button" class="btn" id="confirmBtn">Confirm Arrival</button>';
    }
    html += '</div>';
    if(others.length && !g.arrived){
      html += '<div class="btn-row"><button type="button" class="btn ghost" id="confirmPartyBtn">Check In Whole Party</button></div>';
    }
    html += backButtonHtml();

    card.innerHTML=html;
    wireBack();

    var confirmBtn=document.getElementById('confirmBtn');
    if(confirmBtn) confirmBtn.addEventListener('click',function(){ setArrived(g.id,true,function(){ showGuest(g.id); }); });
    var undoBtn=document.getElementById('undoBtn');
    if(undoBtn) undoBtn.addEventListener('click',function(){ setArrived(g.id,false,function(){ showGuest(g.id); }); });
    var partyBtn=document.getElementById('confirmPartyBtn');
    if(partyBtn) partyBtn.addEventListener('click',function(){
      var ids=[g.id].concat(others.filter(function(m){return !m.arrived;}).map(function(m){return m.id;}));
      Promise.all(ids.map(function(id){ return setArrivedPromise(id,true); })).then(function(){ showGuest(g.id); });
    });
    card.querySelectorAll('.mini-btn[data-mid]').forEach(function(btn){
      btn.addEventListener('click',function(){
        setArrived(btn.getAttribute('data-mid'),true,function(){ showGuest(g.id); });
      });
    });
  }

  function setArrivedPromise(guestId,val){
    var user=auth.currentUser;
    return db.collection('guests').doc(guestId).update({
      arrived:val,
      arrivedAt: val ? firebase.firestore.FieldValue.serverTimestamp() : null,
      checkedInBy: val ? (user?user.email:'') : ''
    });
  }
  function setArrived(guestId,val,cb){
    setArrivedPromise(guestId,val).then(cb).catch(function(){ alert('Could not update — check your connection and try again.'); });
  }

  // ---------- auth ----------
  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var email=document.getElementById('loginEmail').value.trim();
    var pw=document.getElementById('loginPassword').value;
    var btn=document.getElementById('loginBtn');
    var err=document.getElementById('loginError');
    err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
    auth.signInWithEmailAndPassword(email,pw).catch(function(e2){
      err.textContent = (e2.code==='auth/invalid-credential'||e2.code==='auth/wrong-password'||e2.code==='auth/user-not-found')
        ? 'Email or password not recognised — check with Sarah if you\'re not sure.'
        : 'Sign-in failed: '+e2.message;
    }).finally(function(){ btn.disabled=false; btn.textContent='Sign In'; });
  });

  document.getElementById('signOutBtn').addEventListener('click',function(){ auth.signOut(); });

  auth.onAuthStateChanged(function(user){
    var loginScreen=document.getElementById('loginScreen');
    var appWrap=document.getElementById('appWrap');
    var whoBar=document.getElementById('whoBar');
    if(user){
      loginScreen.hidden=true; appWrap.hidden=false; whoBar.hidden=false;
      document.getElementById('whoEmail').textContent=user.email;
      document.getElementById('loginForm').reset();
      loadEvents().then(function(){
        var g=getParam('g');
        if(g){ showGuest(g); }
      });
    }else{
      loginScreen.hidden=false; appWrap.hidden=true; whoBar.hidden=true;
    }
  });
})();
</script>
</body>
</html>
